version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hcmc_price_api
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hcmc_price_dashboard
    ports:
      - "8501:8501"
    command: streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    restart: always
    depends_on:
      - api
